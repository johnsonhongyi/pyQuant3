# pytest.ini - Global Workspace Regression Isolation Configuration
[pytest]
addopts = -p no:warnings -q
pythonpath = stock_standalone .
testpaths = stock_standalone/tests stock_standalone/trading_kernel/tests
norecursedirs = 
    .git 
    .agent_hub 
    .agent_hub_runtime 
    .pytest_cache 
    .pytest_temp 
    .pytest_remote_* 
    __pycache__ 
    build 
    dist 
    stock/webTools 
    stock_standalone/webTools 
    stock_standalone/scratch 
    stock_standalone/tests_archive 
    stock_standalone/archives 
    stock_standalone/design
