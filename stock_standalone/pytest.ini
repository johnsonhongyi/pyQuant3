# pytest.ini - ATS Trading Kernel and Strategy Regression Configuration
[pytest]
addopts = -p no:warnings -q --basetemp=.pytest_temp
pythonpath = .
testpaths = tests trading_kernel/tests
norecursedirs = 
    .git 
    .agent_hub 
    .agent_hub_runtime 
    .pytest_cache 
    .pytest_temp 
    .pytest_remote_* 
    __pycache__ 
    build 
    dist 
    webTools 
    scratch 
    tests_archive 
    archives 
    doc 
    docs 
    design

python_files = test_*.py
python_classes = Test*
python_functions = test_*
