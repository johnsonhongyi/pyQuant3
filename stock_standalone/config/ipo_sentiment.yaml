      route: 固定窗口对数价格回归斜率
      action: 需冻结回归窗口、最少样本与量纲
      source_id: tdx.market_observation_pipeline
      source_version: planned.v1
      source_timezone: Asia/Shanghai
      ttl_seconds: 30.0
      accepted_sources: []
      verified: false
    session_high:
      source: 腾讯/TDX行情
      route: 带时间戳快照当日最高字段
      action: 校验来源身份、时效；TDX须处于连续竞价并有新分钟线
      source_id: tencent.quote_snapshot
      source_version: gtimg_hq.v1
      source_timezone: Asia/Shanghai
      ttl_seconds: 30.0
      accepted_sources:
      - source_id: tdx.quote_snapshot
        source_version: tdx_hq.quote.v1
      verified: false
    session_low:
      source: 腾讯/TDX行情
      route: 带时间戳快照当日最低字段
      action: 校验来源身份、时效；TDX须处于连续竞价并有新分钟线
      source_id: tencent.quote_snapshot
      source_version: gtimg_hq.v1
      source_timezone: Asia/Shanghai
      ttl_seconds: 30.0
      accepted_sources:
      - source_id: tdx.quote_snapshot
        source_version: tdx_hq.quote.v1
      verified: false
    current_price:
      source: 腾讯/TDX行情
      route: 时间戳现价；TDX连续竞价快照备源
      action: 校验六位代码、来源身份及30秒TTL
      source_id: tencent.quote_snapshot
      source_version: gtimg_hq.v1
      source_timezone: Asia/Shanghai
      ttl_seconds: 30.0
      accepted_sources:
      - source_id: tdx.quote_snapshot
        source_version: tdx_hq.quote.v1
      verified: false
    turnover_climb_speed:
      source: TDX行情+流通股本
      route: 换手率固定窗口差分
      action: 需要完整分时量与可信股本
      source_id: tdx.market_observation_pipeline
      source_version: planned.v1
      source_timezone: Asia/Shanghai
      ttl_seconds: 30.0
      accepted_sources: []
      verified: false
    minutes_above_vwap_ratio:
      source: 东方财富/TDX 1分钟行情
      route: 分钟收盘高于截至该分钟累计VWAP的比例
      action: 仅统计当日有效成交分钟；TDX备源须有当日最新分钟线
      source_id: eastmoney.push2his.minute_kline
      source_version: minute_kline.v1
      source_timezone: Asia/Shanghai
      ttl_seconds: 30.0
      accepted_sources:
      - source_id: tdx.minute_bars
        source_version: intraday_1m.v1
      verified: false
    pullback_from_peak_pct:
      source: 腾讯/TDX行情
      route: 现价相对当日最高点回撤
      action: 现价与最高点使用同一报价时间并校验TTL
      source_id: tencent.derived.quote_session_peak
      source_version: quote_with_session_high.v1
      source_timezone: Asia/Shanghai
      ttl_seconds: 30.0
      accepted_sources:
      - source_id: tdx.derived.session_peak_pullback
        source_version: tdx_quote_with_session_high.v1
      verified: false
    halt_count:
      source: 交易所停复牌公告
      route: 临时停牌/复牌事件流
      action: 分钟缺口只能提示，不可直接当作停牌证据
      source_id: tdx.market_observation_pipeline
      source_version: planned.v1
      source_timezone: Asia/Shanghai
      ttl_seconds: 30.0
      accepted_sources: []
      verified: false
  ipo_preheat:
    watch_candidate_threshold: 55.0
    hot_candidate_threshold: 75.0
    weights:
      valuation: 0.25
      subscription: 0.25
      scarcity: 0.2
      theme: 0.2
      capital_structure: 0.1
