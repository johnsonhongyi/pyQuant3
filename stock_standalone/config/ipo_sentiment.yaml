    amount_tight_percentile: 20
    amount_loose_percentile: 80
    advance_decline_shock: 0.2
    limit_down_shock: 30
  t1_carry:
    allow_threshold: 65.0
    caution_threshold: 40.0
    adjustment_bounds:
      max_positive: 10
      max_negative: -25
  listing_anchors:
    d0_open_break_pct: 0.0
  vwap_execution:
    min_price_support_pct: 0.0
    early_anchor_support_pct: 0.0
  trade_gate:
    min_risk_reward: 2.5
    signal_max_age_seconds: 30.0
    risk_clock_skew_seconds: 5.0
    authorization_ttl_seconds: 10.0
    allowed_actions:
