version: 1.1-R9
llm_settings:
  active_backend: antigravity_cli
  allow_remote: false
  request_timeout_seconds: 30.0
  cache_ttl_seconds: 60
  circuit_breaker:
    failure_threshold: 3
    cooldown_seconds: 30
  remote_egress:
    approval_id: ''
    destination: ''
    policy_version: ''
    field_allowlist_by_agent: {}
backends:
  antigravity_cli:
    execution_mode: remote_api
    enabled: false
    cli_path: agy
    scratch_cwd: ''
  codex_cli:
    execution_mode: remote_api
    enabled: false
    bin_path: codex
    scratch_cwd: ''
  antigravity_sdk:
    execution_mode: local_litert
    model_path: ''
    model_sha256: ''
    model_id: ''
  ollama_http:
    base_url: http://127.0.0.1:11434
    model: ''
