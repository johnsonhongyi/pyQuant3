; AI 对话「只读证据」限额配置（桌面桥侧，重启桥后生效）
; 只允许调整限额与开关，端点白名单固定在 desktop_chat_evidence.py，不能通过本文件扩展。
; 也可用环境变量 STOCK_CHAT_EVIDENCE_CONFIG 指向另一份 ini。
; 所有数值都会被硬上限钳制，见 desktop_chat_evidence.py 的 CAPS。
; 冻结打包版由 manage_window_layout.spec 的 datas 带入 exe 作为随包默认值。
; 现场调限额：把本文件放到 manage_window_layout.exe 同目录（或同目录 stock-strategy\ 下）即可覆盖包内副本，重启桥生效。
; 优先级：STOCK_CHAT_EVIDENCE_CONFIG 指定路径 > exe 同目录 > exe 同目录 stock-strategy\ > 包内副本 > 内置 DEFAULTS。
; 实际生效来源见每轮对话结果里的 evidence_config_source。

[chat_evidence]
; 0 = 全部只读证据关闭（回到纯离线问答），1 = 启用
enabled = 1
; 服务端各板块 GET 白名单读取
server_sections_enabled = 1
; 本机桌面桥 TK/ATS 信号库只读读取
local_signals_enabled = 1

; 单个服务端请求的超时（秒）与响应字节上限
; 冷缓存时连板天梯/热门股/K线等接口内部最长可达 18~20 秒，6 秒会误判为不可用
request_timeout_seconds = 12
; 持仓AI巡检单条记录约 0.5MB，需留足余量；板块返回仍会被 section_max_bytes 裁剪
endpoint_max_bytes = 1500000

; 单个板块/工具返回给模型的字节上限；超限时按结构裁剪并标注 truncated
section_max_bytes = 48000
; 本机信号单次返回的条数、回溯天数（相对各源最新日期）与字节上限
local_max_rows = 120
local_max_days = 7
local_max_bytes = 40000

; Antigravity CLI 无工具调用，预取证据包注入 prompt 的总字节上限
prefetch_max_bytes = 30000
; Codex 每轮也注入一份较小的保底证据包（0 = 关闭常规保底）；
; 续接历史会话若 app-server 拒绝 dynamicTools，证据包成为唯一数据通道，
; 此时自动升级为 prefetch_max_bytes，仍保证有数据的回答
codex_prefetch_max_bytes = 12000
; 每轮对话的证据工具调用次数与累计字节预算
max_tool_calls = 16
max_tool_bytes = 240000
; 裁剪时单个长文本字段保留的字符数（保留日期/数字等短标量）
string_max_chars = 900
