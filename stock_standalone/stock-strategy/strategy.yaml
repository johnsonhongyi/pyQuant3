# ============ 数字货币永续做空镜像策略(2026-10-03 用户拍板) ============
# 10倍杠杆/小时级触发,不照搬股票T+1日线模式。独立账本 logs/paper_ledger_crypto_short.json,
# 独立空头 kill(记账本内 short_kill 字段,不碰 logs/kill_switch.json)。
# 盈亏按保证金记: pnl_margin=(entry-exit)/entry×leverage×margin - 双边手续费(名义价值)。
# 空头 kill:单笔保证金亏损≥30% 或 单日已实现(保证金口径)/当日保证金基数 ≤-20% -> 停新开空,平仓照常。
crypto_short:
  account:
    initial_capital: 100000  # 美元(保证金池)
    currency: USD
    leverage: 10
    amount_per_trade: 10000  # 美元/笔(保证金),名义价值=10万
    max_positions: 5
    fee_per_side: 0.001  # 按名义价值双边(开空10万名义=100,平空按实际名义)
  entry:  # 开空:UTC小时级触发 + 日线趋势过滤;数据不可验证一律 fail-closed 不开
    s_p25_bear: true      # S-P25空头趋势门:1日VWAP<3日VWAP<5日VWAP 且 昨收<MA20(已收盘UTC日K)
    s_pool_score: 8.0     # S-pool阈值:S-P25通过+4;24h涨跌[-8%,-1%]+3;昨日成交额>20日均×1.5+3
    s_p8_hourly:          # S-P8小时触发(镜像多头P8四条件,方向反转)
      below_hourly_vwap: 0.995   # 现价 < 当日小时VWAP×0.995
      max_below_vwap_pct: 2.5    # 空头偏离门(镜像多头偏离<2.5%不追高):价格低于小时VWAP超2.5%不追空,等回抽
      declining_hours: 3         # 近3根已收盘小时K收盘递减
      vol_mult: 1.5              # 最后一根收盘小时量 > 前5根均量×1.5(下跌放量)
      hourly_vwap_below_d3: true # 小时VWAP < 3日VWAP(多日空头结构)
    s_p24_breakdown:      # S-P24大阴跟随(镜像多头P24大阳跟随)
      big_down_pct: -0.07        # 近3日出现 ≤-7% 大阴线
      bounce_limit: 1.02         # 现价 < 大阴最低×1.02(没像样反弹,仍弱)
    sentiment_block_above: 40   # 情绪分>+40(过热)不开空;情绪不可验证->fail-closed
    max_positions: 5
  exit:  # 平空:价格距离按10倍折算保证金损益;优先级:强平守卫>硬止损>部分止盈>全止盈>VWAP收复>时间止损
    partial_tp_pct: -0.015      # -1.5% 平 2/3(镜像用户"盈利先卖2/3"纪律)
    full_tp_pct: -0.03          # 剩余 -3% 全平
    hard_stop_pct: 0.015        # +1.5% 从entry全平(≈保证金-15%)
    vwap_reclaim_mult: 1.005    # 小时收盘站上开仓日小时VWAP×1.005 -> 全平(空头逻辑证伪)
    time_stop_hours: 24         # 持仓超24h且|涨跌|<1% -> 平(效率止损)
    liq_buffer: 0.005           # 强平价=entry×(1+1/杠杆-0.005);mark距强平<2%紧急全平
  kill:
    single_loss_margin_pct: 0.30  # 单笔保证金亏损≥30% -> 停新开空
    day_loss_margin_pct: 0.20     # 单日已实现/当日保证金基数 ≤-20% -> 停新开空
  signal:
    enabled: true
    note: 币圈空头信号=paper_trade.py --market CRYPTO --side short --signal,每天 02/06/10/14/18/22 UTC 各跑一次(与多头错开);每轮先做持仓exit管理(4h粒度),再看entry
    settle_note: 每日 bars-append 后跑 --side short --settle,做最终对账+killed检查+复盘统计
  notes:
    - "P11网格对空头无意义,跳过(已在代码注明);P12轮动/情绪门禁保留(情绪方向镜像:过热不开空)。"
    - "10倍下±1.5%价格位移=±15%保证金,参数为初版,待样本验证后由周复盘调。"
    - "spec 原文示例 'entry100→exit97,margin10000 应≈+30000-200手续费' 有误:正确=(3%×10×10000)-197≈+2803,已按正确数学实现。"

# ============ 影子实验仓(2026-10-03 用户批准,paper only) ============
# 独立账本 logs/paper_ledger_crypto_exp.json(多头)/logs/paper_ledger_crypto_exp_short.json(空头),
# 独立决策日志 decisions_crypto_exp[_short]_<UTC日期>.json(全程打标 sleeve:"exp"),
