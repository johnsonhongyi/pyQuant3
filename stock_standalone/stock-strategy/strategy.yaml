  - id: P5_大跌装死日
    from: 用户2026-09-28口述
    desc: 4500只大跌时所有人装死无法操作,直到波动率消失。机器无情绪是优势:按规则执行但不逆势。
    impl: down_count>4000 -> dead_day,当日不新开仓(已有持仓按卖出规则正常处理)
