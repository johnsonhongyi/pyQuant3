# 统一决策门(2026-10-01):各P门仍独立计算(行为不变),本门只做汇总评分+记录。
# mode=shadow 时不做最终裁决;攒够 20-30 笔样本后由周复盘决定是否转 enforce。
decision_gate:
  version: v1
  mode: shadow
  threshold: 60
  weights:  # 满分100,初版权重,待样本验证后调
    p8_four: 30      # P8四条件全过
    p25: 20          # 趋势门(1日>3日>5日VWAP且站上MA20)
    p26_sector: 15   # 板块四维分>=50
    pool_score: 15   # 关注池分>=8
    p22_leader: 10   # 龙头L2确认(暂未接入信号链,预留)
    sentiment: 10    # 情绪分>0
  kill:
    max_day_loss_pct: 0.03  # 单日已实现亏损超3% -> 自动拉起 kill switch

buy:
  min_pool_score: 8.0      # 关注池综合分
  min_market_sentiment: -40 # 市场情绪低于冰点不买
  min_market_sentiment_low_water: -15  # 水位连续下降3日时收紧到该值(P2)
  max_ch_pos: 80           # ch_pos 超过不追
  max_day_chg: 7.0         # 当日涨幅超7%不追:加速末端(P4)
  forbid_trap: true        # 早盘诱多不买
  forbid_dead_day: true    # 大跌装死日(down>4000)不新开仓(P5)
  max_positions: 5         # 最多同时持有
  amount_per_trade: 100000  # 每笔金额(元)

sell:
  take_profit: 0.10   # +10% 止盈
  stop_loss: -0.06    # -6% 止损
  vwap_stop: 0.02     # 跌破买入日1日VWAP-2% 止损(VWAP节奏器)
  break_ma10: true    # P6: 收盘跌破买入时10日VWAP -> 破位止损
  emotion_cool_profit: 0.05  # P3: 新股风向标降温到低 -> 浮盈超5%提前止盈
  max_hold_days: 5    # 最长持有5个交易日
  p20_band: 0.01      # P20: 保本区=成本±1%

add:
  max_add_per_position: 1  # P7: 每只最多加仓一次
  add_trigger_loss: -0.03  # 浮亏超过3%才考虑翻转加仓
  add_amount: 10000        # 加仓金额(元)

# P11 两日网格做T(2026-09-29):已有持仓专用,不受新开仓门禁限制
grid:
  amount_per_grid: 100000  # 每次网格买回金额(元)
  sell_lo: 1.005          # 卖出区下沿 = 两日最高×1.005
  sell_hi: 1.01           # 卖出区上沿 = 两日最高×1.01
  buy_lo: 1.01            # 买入区下沿 = 两日最低×1.01
  buy_hi: 1.02            # 买入区上沿 = 两日最低×1.02
  trend_break: 0.99       # 跌破10日VWAP×0.99 -> 趋势走坏,一键清仓

# P12 资金轮动(2026-09-29):统一强度分,卖弱+强者打码,资金不闲置
rotation:
  weak_th: -3            # 强度分<=-3 卖弱轮动(疑似破位单扣-2,不触发)
  strong_th: 4           # 强度分>=4 强者打码
  pyramid_amount: 100000  # 打码金额(元)
  dead_day_relief: -15   # 盘中情绪>=该值解除盘前dead_day门禁

# 用户感知编码区:用户口述的市场感觉 -> 翻译成可执行规则
perception_rules:
  - id: P1_调仓换股
    from: 用户2026-09-28口述
    desc: 高位科技放量下跌/上涨无力后,资金流向低位板块。基金80%持仓规则+季度披露期驱动调仓。
    impl: sentiment.premarket 输出板块轮动(new_in/dropped_out);调仓窗口日新进入hot_sectors的板块,watchpool打分时其成分+2
    status: 已实现(轮动检测);打分加成待watchpool接入
  - id: P2_蓄水池水位
    from: 用户2026-09-28口述
    desc: 市场是蓄水池,成交额=水位。水蒸发(资金流出)->水平面降低->指数重心下移;每波结构就是水平面。
    impl: 全市场成交额5日均值连续下降3日 -> 水位下降,买入门槛从-40收紧到-15
    status: 已实现
  - id: P3_新股风向标
    from: 用户2026-09-28口述
    desc: 新股次新股是情绪风向标(ATS有专门tab+ipo_detector)。
    impl: 首板数(异动集涨停池)+最高连板 -> 风险偏好 高/中/低;偏好低时买入门槛收紧
    status: 已实现(首板+连板代理指标)
  - id: P4_加速末端
    from: 用户2026-09-28口述
    desc: T+1下,大涨+放量基本是最后一个加速器,追高=接盘(金健米业式)。
    impl: 当日涨幅>7% 标记加速末端,模拟盘不追
