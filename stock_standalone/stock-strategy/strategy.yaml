# 主 sleeve 的 pool [6,8) 候选 append-only 记 logs/near_miss_crypto.jsonl(只记录不交易),
# 供周一 paper-review 复盘"拦掉的该不该买"。paper_trade --sleeve exp(仅 CRYPTO 可用)。
crypto_exp:
  min_pool_score: 6.0   # 实验入场阈值(主=8.0);多头 cfg.buy.min_pool_score / 空头 crypto_short.entry.s_pool_score 共用
  note: 退出规则/手续费/杠杆/止盈止损距离与主完全相同;推送标题加 [实验] 前缀(@在路上不变)

# P30 时间周期结构(2026-10-03 用户感知:涨跌段的时间周期+斜率量化的是情绪本身)。
# 只读展示+回测验证,不自动交易。阈值初版,待样本复盘再调。
p30_cycle:
  version: v2
  swing_k: 2            # 摆动点左右各 k 根小时K确认
  lookback_hours: 96    # 回看小时数
  weak_time_ratio: 1.2  # 弱反弹(情绪消耗):反弹时长/下跌时长 > 该值
  weak_retrace: 0.382   # 弱反弹:反弹点数/下跌点数 < 该值
  steady_slope_mult: 1.5 # 稳态:快段斜率 > 慢段斜率×该值
  accel_mult: 1.0       # 结构切换:3小时内急拉斜率 > 下跌段斜率×该值(V型选择,另需3h内修复超38.2%)
  accel_window: 3       # 加速判定时长(小时)
  switch_window: 24     # 结构切换:弱反弹形态过期时长(小时),过期不再触发
  break_tol: 0.002      # 破前高/前低容差
  expect_ratio_warn: 1.0  # 不及预期预警:反向段时长/原段时长 ≥ 该值(建议出局)
  expect_ratio_exit: 2.0  # 不及预期出局:≥ 该值策略单自动平(镜像单只预警)
  expect_cooldown_h: 12   # 不及预期平空后,该币种 N 小时内不再新开空(防"平完秒开"churn)

crypto_universe:
  version: v1
  min_vol_24h_usd: 20000000  # 24h 成交额门槛(美元);低于直接 SKIP 不进池
  dynamic_top_n: 12          # 静态6币之外取动态 TopN
  max_total: 18              # 宇宙总数上限(静态+动态)
  backfill_days: 180         # 新入选币种回填日K天数(seeded 防重复)
