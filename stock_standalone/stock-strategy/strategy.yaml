    desc: 10:05买入基本上会被诱多,除非走势非常漂亮的首日VWAP结构+量价齐升。A股日内高点节点:9:45/10:00/10:15/10:30/11:30。下午守住+情绪好,次日有机会收益(T+1)。
    impl: 10:05买入四条件(站上1日VWAP×1.005 + 量价齐升 + 偏离VWAP<2.5% + 盘中VWAP>=3日VWAP多日结构过滤),节点冲高回落不买;预开仓/竞价买入绕开10:05追高;早盘数据不可验证时一律不买(fail-closed,2026-09-29故障窗口盲买教训)
